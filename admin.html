<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOWSHOPPING Admin</title><style>
*{box-sizing:border-box}
:root{
  --admin-bg:#f6f7f9;
  --admin-panel:#fff;
  --admin-border:#e5e7eb;
  --admin-text:#111827;
  --admin-muted:#6b7280;
  --admin-sidebar:#111827;
  --admin-sidebar-hover:#1f2937;
  --admin-accent:#60a5fa;
}
html,body{min-height:100%}
body{
  margin:0;
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--admin-bg);
  color:var(--admin-text);
}
button,input,textarea,select{font:inherit}
button{transition:all .15s ease}
.app{display:flex;min-height:100vh;background:var(--admin-bg)}
.side{
  width:250px;
  min-height:100vh;
  flex-shrink:0;
  position:fixed;
  inset:0 auto 0 0;
  z-index:20;
  display:flex;
  flex-direction:column;
  background:var(--admin-sidebar);
  color:#fff;
  box-shadow:8px 0 30px rgba(15,23,42,.08);
}
.brand{
  padding:22px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-weight:800;
  font-size:18px;
  line-height:1.15;
  letter-spacing:.1px;
}
.brand small{
  display:block;
  margin-top:4px;
  color:#94a3b8!important;
  font-size:11px!important;
  letter-spacing:1.4px;
}
.nav{
  padding:12px;
  overflow:auto;
  display:grid;
  gap:4px;
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#d1d5db;
  text-align:left;
  padding:11px 12px;
  border-radius:7px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font:inherit;
  font-weight:600;
}
.nav button:hover,.nav button.active{
  background:var(--admin-sidebar-hover);
  color:#fff;
}
.nav button.active{
  color:var(--admin-accent);
}
.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
  min-height:100vh;
  overflow:auto;
  background:var(--admin-bg);
}
.top{
  min-height:68px;
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid var(--admin-border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:14px 24px;
}
.top h1{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.3px;
}
.top .muted{margin-top:3px}
.view{display:none}
.view.active{display:block}
#views{padding:24px;max-width:1500px;margin:0 auto}
.card{
  background:var(--admin-panel);
  border:1px solid var(--admin-border);
  border-radius:10px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:none;
}
.toolbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.toolbar b{font-size:18px}
.btn{
  border:1px solid #d1d5db;
  background:#fff;
  color:#111827;
  border-radius:7px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:600;
}
.btn:hover{background:#f9fafb;transform:translateY(-1px)}
.primary{background:#111827;color:#fff;border-color:#111827}
.primary:hover{background:#1f2937}
.danger{color:#b91c1c}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.stat{font-size:26px;font-weight:800;margin-top:6px}
.label{
  font-size:12px;
  color:#6b7280;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.table{width:100%;border-collapse:collapse}
.table th,.table td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}
.table th{
  font-size:11px;
  text-transform:uppercase;
  color:#6b7280;
}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#fafafa}
.thumb{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #edf0f4;
}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding:12px;
  border-bottom:1px solid #eee;
}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;color:#374151}
.field input,.field textarea,.field select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:7px;
  background:#fff;
  outline:none;
  font:inherit;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:#6b7280;
  box-shadow:0 0 0 3px rgba(17,24,39,.06);
}
.field textarea{min-height:100px;resize:vertical}
.switch{display:flex;gap:8px;align-items:center;font-weight:600}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modal.open{display:flex}
.modalbox{
  background:#fff;
  border-radius:10px;
  width:min(1280px,100%);
  max-height:94vh;
  overflow:auto;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}
.themegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.theme{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  background:#fff;
  cursor:pointer;
  text-align:left;
}
.swatches{display:flex;height:35px}
.swatches i{flex:1}
.muted{color:#6b7280}
.pm-toolbar{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:10px;align-items:end}
.pm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.pm-kpi{
  padding:15px 16px;
  border:1px solid #e7eaf0;
  border-radius:10px;
  background:#fff;
}
.pm-kpi strong{display:block;font-size:22px;margin-top:5px}
.pm-empty{text-align:center;padding:42px;color:#778195}
.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:999px;
  background:#eefbf3;
  color:#16794b;
  font-size:11px;
  font-weight:750;
}
.status.off{background:#f1f3f6;color:#667085}
.type-pill{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  background:#f4f6f8;
  color:#475467;
  font-size:11px;
  font-weight:700;
}

.photo-manager{border:1px solid #e2e8f0;border-radius:18px;padding:20px;background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);box-shadow:0 8px 28px rgba(15,23,42,.05);margin:8px 0}
.photo-manager-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.photo-manager-head b{display:block;font-size:16px;letter-spacing:-.2px;margin:3px 0}
.pm-section-kicker{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#64748b}

.upload-btn{display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:1px solid #0f172a;background:#0f172a;color:#fff;border-radius:11px;padding:11px 15px;font-weight:750;box-shadow:0 6px 16px rgba(15,23,42,.15)}
.upload-btn:hover{background:#1e293b;transform:translateY(-1px)}
.upload-icon{font-size:18px;line-height:1}
.photo-dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:240px;border:1.5px dashed #cbd5e1;border-radius:14px;background:#f8fafc;cursor:pointer;text-align:center;padding:22px;transition:.18s ease}

.photo-dropzone strong{font-size:14px;color:#0f172a}

.photo-data-store{display:none!important}

.photo-manager{padding:26px;min-height:360px}
.photo-dropzone{border-width:2px}

.photo-item{position:relative;border:1px solid #e2e8f0;border-radius:13px;background:#fff;padding:6px;overflow:hidden;box-shadow:0 4px 15px rgba(15,23,42,.05)}
.photo-item img{display:block;width:100%;height:170px;object-fit:cover;border-radius:9px;background:#f1f5f9}

.product-name{font-weight:750}
.product-meta{font-size:11px;color:#8a94a6;margin-top:3px}

  .main{margin-left:0;width:100%;min-height:0}
  .nav{grid-template-columns:repeat(2,1fr)}
  .grid,.themegrid{grid-template-columns:1fr 1fr}
  .two,.pm-toolbar,.pm-kpis{grid-template-columns:1fr 1fr}
  #views{padding:16px}
}
@media(max-width:560px){
  .nav{grid-template-columns:1fr}
  .grid,.themegrid,.two,.pm-toolbar,.pm-kpis{grid-template-columns:1fr}

  .top{padding:14px}
  #views{padding:14px}
}

function addProductPhotoUrl(){
  const input=document.getElementById('photoUrlInput');

  try{new URL(url)}catch(e){alert('Please enter a valid photo URL.');input?.focus();return}
  const imgs=getProductPhotoList();
  if(imgs.length>=30){alert('Maximum 30 photos per product.');return}
  if(imgs.includes(url)){alert('This photo URL is already added.');return}

function getProductPhotoList(){

function handleProductPhotoDrop(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragging');
  const files=[...(ev.dataTransfer?.files||[])];
  addProductPhotoFiles(files);
}
function addProductPhotos(ev){
  addProductPhotoFiles([...(ev.target.files||[])]);
  ev.target.value='';
}
function addProductPhotoFiles(files){
  if(!files.length)return;
  const current=getProductPhotoList();
  const remaining=Math.max(0,30-current.length);
  if(!remaining){alert('Maximum 30 photos per product.');return}
  let accepted=0;
  files.slice(0,remaining).forEach(file=>{
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))return;
    accepted++;
    const reader=new FileReader();
    reader.onload=()=>{
      const data=String(reader.result||'');
      optimizeProductImage(data,file.type).then(result=>{
        current.push(result);
        setProductPhotoList(current);
      });
    };
    reader.readAsDataURL(file);
  });
  if(files.length>remaining)alert('Maximum 30 photos per product.');
  if(!accepted)alert('Please select JPG, PNG, WEBP or GIF image files.');
}
function optimizeProductImage(dataUrl,type){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      const mime=type==='image/png'?'image/webp':'image/webp';
      try{resolve(canvas.toDataURL(mime,.84));}catch(e){resolve(dataUrl)}
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function editMenu(mid,parentOverride){

  const currentId=m.id;
  const descendants=new Set();

  collect(currentId);
  const opts=[`<option value="">Top level</option>`].concat((d.menu||[]).filter(x=>x.id!==currentId&&!descendants.has(x.id)).map(x=>{
    let depth=0,cur=x; const seen=new Set(); while(cur?.parent && !seen.has(cur.parent)){seen.add(cur.parent);depth++;cur=(d.menu||[]).find(y=>y.id===cur.parent)}
    return `<option value="${esc(x.id)}" ${m.parent===x.id?'selected':''}>${'— '.repeat(Math.min(depth,8))}${esc(x.title||'Untitled')}</option>`

function saveBenefits(){const b=d.benefits||{};b.visible=document.getElementById('benefitsVisible')?.checked!==false;b.cards=(b.cards||[]).slice(0,4);for(let i=0;i<4;i++){const c=b.cards[i]||{id:'benefit'+(i+1)};c.id=c.id||'benefit'+(i+1);c.icon=(document.getElementById('bfIcon'+i)?.value||'star').trim();c.title=(document.getElementById('bfTitle'+i)?.value||'').trim();c.text=(document.getElementById('bfText'+i)?.value||'').trim();c.visible=document.getElementById('bfShow'+i)?.checked!==false;b.cards[i]=c}d.benefits=b;save();try{localStorage.setItem(KEY,JSON.stringify(d));window.dispatchEvent(new StorageEvent('storage',{key:KEY}));}catch(e){}toast('Benefits Bar saved')}
const THEMES={Midnight:['#111827','#f8fafc','#111827','#fff','#0f172a'],Blue:['#2563eb','#fff','#111827','#fff','#111827'],Emerald:['#047857','#ecfdf5','#064e3b','#fff','#064e3b'],Rose:['#be185d','#fff1f2','#500724','#fff','#500724'],Purple:['#7c3aed','#f5f3ff','#2e1065','#fff','#2e1065'],Teal:['#0f766e','#f0fdfa','#134e4a','#fff','#134e4a'],Orange:['#ea580c','#fff7ed','#431407','#fff','#431407'],Slate:['#475569','#f8fafc','#0f172a','#fff','#0f172a'],Cream:['#8b5e34','#fffaf0','#3d2b1f','#fff','#3d2b1f'],BlackGold:['#b08d57','#0b0b0b','#f5f5f5','#111','#050505'],Sky:['#0284c7','#f0f9ff','#082f49','#fff','#082f49'],Lavender:['#8b5cf6','#faf5ff','#3b0764','#fff','#3b0764']};
function theme(){let t=d.theme;v('theme').innerHTML=`<div class="card"><h3>Presets</h3><div class="themegrid">${Object.entries(THEMES).map(([n,x])=>`<button class="theme" onclick="preset('${n}')"><div class="swatches"><i style="background:${x[0]}"></i><i style="background:${x[1]}"></i><i style="background:${x[3]}"></i><i style="background:${x[4]}"></i></div><b>${n}</b></button>`).join('')}</div></div><div class="card form"><h3>Custom colors</h3><div class="two"><div class="field"><label>Primary</label><input id="tp" type="color" value="${t.primary}"></div><div class="field"><label>Background</label><input id="tbg" type="color" value="${t.background}"></div><div class="field"><label>Text</label><input id="tt" type="color" value="${t.text}"></div><div class="field"><label>Header</label><input id="th" type="color" value="${t.header}"></div><div class="field"><label>Footer</label><input id="tf" type="color" value="${t.footer}"></div><div class="field"><label>Sale</label><input id="ts" type="color" value="${t.sale}"></div></div><button class="btn primary" onclick="saveTheme()">Save Theme</button></div>`}

function saveTheme(){Object.assign(d.theme,{primary:tp.value,background:tbg.value,text:tt.value,header:th.value,footer:tf.value,sale:ts.value});save()}
function branding(){let b=d.branding||{};v('branding').innerHTML=`<div class="card form"><h3>Store Identity</h3><div class="two"><div class="field"><label>Brand name</label><input id="brn" value="${esc(b.name)}"></div><div class="field"><label>Browser title</label><input id="brt" value="${esc(b.title)}"></div></div><div class="field"><label>Logo image URL</label><input id="brl" placeholder="https://..." value="${esc(b.logo||'')}" oninput="previewBrandImage('brl','brlogoPreview')"><div id="brlogoPreview" style="margin-top:10px"></div></div><div class="field"><label>Logo/Icon URL</label><input id="bri" placeholder="https://..." value="${esc(b.icon||'')}" oninput="previewBrandImage('bri','briconPreview')"><div id="briconPreview" style="margin-top:10px"></div></div><div class="field"><label>Favicon URL</label><input id="brfv" placeholder="https://..." value="${esc(b.favicon||'')}"><small class="muted">Use a direct image URL ending in .png, .jpg, .jpeg, .webp or .ico. Do not paste a webpage URL.</small></div><div class="field"><label>Footer text</label><textarea id="brf">${esc(b.footer)}</textarea></div><button class="btn primary" onclick="saveBranding()">Save Branding</button></div>`;setTimeout(()=>{previewBrandImage('brl','brlogoPreview');previewBrandImage('bri','briconPreview')},0)}
function cleanImageUrl(x){x=String(x||'').trim();if(!x)return '';if(/^['"]/.test(x)&&/["']$/.test(x))x=x.slice(1,-1);return x}
function previewBrandImage(inputId,previewId){const url=cleanImageUrl(document.getElementById(inputId)?.value);const box=document.getElementById(previewId);if(!box)return;if(!url){box.innerHTML='';return}box.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff"><img src="${esc(url)}" style="width:72px;height:48px;object-fit:contain;border-radius:7px;background:#f3f4f6" onerror="this.style.display='none';this.nextElementSibling.textContent='Image URL could not be loaded'"><span class="muted">Preview</span></div>`}
function saveBranding(){const name=(document.getElementById('brn')?.value||'').trim();const title=(document.getElementById('brt')?.value||'').trim();const logo=cleanImageUrl(document.getElementById('brl')?.value);const icon=cleanImageUrl(document.getElementById('bri')?.value);const favicon=cleanImageUrl(document.getElementById('brfv')?.value);const footer=(document.getElementById('brf')?.value||'').trim();d.branding={...(d.branding||{}),name,title,logo,icon,favicon,footer};save();toast('Branding saved — refresh the storefront to see the favicon/logo.')}
function toggle(type,ident){let x=(d[type]||[]).find(x=>String(x.id)===String(ident));if(x){x.visible=x.visible===false;save()}}
function del(type,ident){
  if(!confirm('Delete this item?'))return;
  const sid=String(ident);
  if(type==='categories'){
    const cat=(d.categories||[]).find(x=>String(x.id)===sid);
    if(!cat){toast('Category not found');return;}
    const catName=String(cat.name||'').trim().toLowerCase();
    d.categories=(d.categories||[]).filter(x=>String(x.id)!==sid);
    // Keep products, but remove the deleted category assignment so the category is truly gone.
    (d.products||[]).forEach(p=>{if(String(p.category||'').trim().toLowerCase()===catName)p.category='';});
    // Remove category links from menu items without deleting the menu itself.
    (d.menu||[]).forEach(m=>{if(String(m.category||'').trim().toLowerCase()===catName)m.category='';});
    save();
    return;
  }
  if(!Array.isArray(d[type]))return;
  d[type]=d[type].filter(x=>String(x.id)!==sid);
  save();
}
function open(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modalbox').innerHTML=''}

function care(){v('care').innerHTML=`<div class="toolbar"><b>Customer Care links</b><button class="btn primary" onclick="editCare()">+ Add</button></div><div class="card">${(d.care.cards||[]).map(c=>`<div class="row"><div><b>${esc(c.title)}</b><div class="muted">${esc(c.text||'')} · ${esc(c.href||'')}</div></div><div class="actions"><button class="btn" onclick="editCare('${c.id}')">Edit</button><button class="btn" onclick="toggleCare('${c.id}')">${c.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="deleteCare('${c.id}')">Delete</button></div></div>`).join('')}</div><div class="card"><b>Email removal</b><p class="muted">The hard-coded Email Us card is hidden. Add a replacement only if you want one.</p></div>`}
function editCare(cid){let c=cid?d.care.cards.find(x=>x.id===cid):{id:id('care'),title:'',text:'',value:'Open',href:'#',visible:true};open(`<h2>${cid?'Edit':'Add'} Customer Care Link</h2><div class="form"><div class="field"><label>Title</label><input id="ct" value="${esc(c.title)}"></div><div class="field"><label>Text</label><input id="cx" value="${esc(c.text)}"></div><div class="field"><label>Button</label><input id="cv" value="${esc(c.value||'Open')}"></div><div class="field"><label>URL</label><input id="ch" value="${esc(c.href||'#')}"></div><label class="switch"><input id="cshow" type="checkbox" ${c.visible!==false?'checked':''}> Show</label><button class="btn primary" onclick="saveCare('${c.id}')">Save</button></div>`)}
function saveCare(cid){let c={id:cid,title:ct.value,text:cx.value,value:cv.value,href:ch.value,visible:cshow.checked};let i=d.care.cards.findIndex(x=>x.id===cid);if(i<0)d.care.cards.push(c);else d.care.cards[i]=c;save();closeModal()}
function toggleCare(cid){let c=d.care.cards.find(x=>x.id===cid);if(c){c.visible=c.visible===false;save()}}
function deleteCare(cid){d.care.cards=d.care.cards.filter(x=>x.id!==cid);save()}
function footer(){
 let f=d.footer||{}; if(!Array.isArray(f.sections))f.sections=[];
 const sections=f.sections.map((sec,i)=>`<div class="card footer-section-card"><div class="toolbar"><div><b>Footer Column ${i+1}</b><div class="muted">Title and links shown in the storefront footer.</div></div><div class="actions"><button class="btn" onclick="footerSectionToggle(${i})">${sec.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="footerSectionDelete(${i})">Delete</button></div></div><div class="two"><div class="field"><label>Column title</label><input id="fs_title_${i}" value="${esc(sec.title||'')}"></div><div class="field"><label>Column ID</label><input id="fs_id_${i}" value="${esc(sec.id||'')}"></div></div><div>${(sec.links||[]).map((ln,j)=>`<div class="row footer-link-row"><div style="flex:1"><div class="two"><input id="fs_${i}_${j}_label" value="${esc(ln.label||'')}" placeholder="Link text"><input id="fs_${i}_${j}_url" value="${esc(ln.url||'')}" placeholder="#shop or https://..."></div></div><div class="actions"><button class="btn" onclick="footerLinkToggle(${i},${j})">${ln.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="footerLinkDelete(${i},${j})">Delete</button></div></div>`).join('')}</div><button class="btn" onclick="footerLinkAdd(${i})">+ Add Link</button></div>`).join('');
 v('footer').innerHTML=`<div class="toolbar"><div><b>Professional Footer Manager</b><div class="muted">Edit every footer column, link text, link URL, visibility, payment method and footer text. Company/Customer Care page content is edited in Pages & Customer Care.</div></div><button class="btn primary" onclick="footerSectionAdd()">+ Add Footer Column</button></div><div class="card form"><label class="switch"><input id="fv" type="checkbox" ${f.visible!==false?'checked':''}> Show Footer</label><div class="field"><label>Footer description</label><textarea id="fd">${esc(f.description||d.branding?.footer||'')}</textarea></div><div class="two"><div class="field"><label>Copyright text</label><input id="fc" value="${esc(f.copyright||'© 2026 '+(d.branding?.name||'WOWSHOPPING.lk')+'. All rights reserved.')}"></div><div class="field"><label>Security text</label><input id="fsecure" value="${esc(f.secureText||'Secure Shopping')}"></div></div><div class="two"><div class="field"><label>Customer Care email</label><input id="femail" value="${esc(f.contact?.email||'')}" placeholder="support@example.com"></div><div class="field"><label>Customer Care phone</label><input id="fphone" value="${esc(f.contact?.phone||'')}" placeholder="+94 ..."></div></div><div class="field"><label>WhatsApp number / link</label><input id="fwa" value="${esc(f.contact?.whatsapp||'')}" placeholder="https://wa.me/..."></div></div>${sections}<div class="card form"><h3>Payment Methods</h3>${(f.payments||[]).map((p,i)=>`<div class="row"><b>${esc(p.name)}</b><div class="actions"><button class="btn" onclick="payToggle(${i})">${p.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="payDelete(${i})">Delete</button></div></div>`).join('')}<div class="two"><div class="field"><label>Add payment platform</label><input id="newpay" placeholder="VISA, COD, KOKO, etc."></div><button class="btn" onclick="payAdd()">Add Payment</button></div></div><div class="card"><h3>Social & Footer Links</h3><div class="muted">Use the Social & Footer section in the sidebar to edit social platforms and URLs.</div></div><button class="btn primary" onclick="saveFooter()">Save All Footer Changes</button>`
}
function footerSectionAdd(){d.footer.sections.push({id:'section'+Date.now(),title:'New Column',visible:true,links:[]});save()}
function footerSectionToggle(i){d.footer.sections[i].visible=d.footer.sections[i].visible===false;save()}
function footerSectionDelete(i){d.footer.sections.splice(i,1);save()}
function footerLinkAdd(i){d.footer.sections[i].links.push({label:'New Link',url:'#',visible:true});save()}
function footerLinkToggle(i,j){d.footer.sections[i].links[j].visible=d.footer.sections[i].links[j].visible===false;save()}
function footerLinkDelete(i,j){d.footer.sections[i].links.splice(j,1);save()}
function payAdd(){let n=newpay.value.trim();if(n){d.footer.payments.push({name:n,visible:true});save()}}
function payToggle(i){d.footer.payments[i].visible=d.footer.payments[i].visible===false;save()}
function payDelete(i){d.footer.payments.splice(i,1);save()}
function saveFooter(){d.footer.visible=fv.checked;d.footer.description=fd.value;d.footer.copyright=fc.value;d.footer.secureText=fsecure.value;d.footer.contact={email:document.getElementById('femail')?.value.trim()||'',phone:document.getElementById('fphone')?.value.trim()||'',whatsapp:document.getElementById('fwa')?.value.trim()||''};d.footer.sections=d.footer.sections.map((sec,i)=>({...sec,title:document.getElementById('fs_title_'+i)?.value?.trim()||sec.title,id:document.getElementById('fs_id_'+i)?.value?.trim()||sec.id,links:(sec.links||[]).map((ln,j)=>({...ln,label:document.getElementById('fs_'+i+'_'+j+'_label')?.value?.trim()||ln.label,url:document.getElementById('fs_'+i+'_'+j+'_url')?.value?.trim()||ln.url}))}));save()}
function shipping(){v('shipping').innerHTML=`<div class="card form"><div class="two"><div class="field"><label>Standard</label><input id="ss" type="number" value="${d.shipping?.standard||350}"></div><div class="field"><label>Express</label><input id="se" type="number" value="${d.shipping?.express||650}"></div></div><button class="btn primary" onclick="d.shipping={standard:+ss.value||0,express:+se.value||0};save()">Save Shipping</button></div>`}

boot();

<script>
(function(){
 const KEY='wow_admin_data_v4';
 const esc9=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
 const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}};
 function ensure(){
   if(!d.footer)d.footer={visible:true,description:'Premium online shopping experience.',copyright:'',secureText:'Secure Shopping',payments:[],sections:[],contact:{email:'',phone:'',whatsapp:''}};
   if(!Array.isArray(d.footer.payments))d.footer.payments=[];
   if(!d.footer.contact||typeof d.footer.contact!=='object')d.footer.contact={email:'',phone:'',whatsapp:''};
   if(!Array.isArray(d.footer.sections))d.footer.sections=[];
   if(!d.footer.sections.length)d.footer.sections=[
     {id:'shopping',title:'Shopping',visible:true,links:[{label:'Men',url:'#shop',visible:true},{label:'Women',url:'#shop',visible:true},{label:'Kids',url:'#shop',visible:true},{label:'Accessories',url:'#shop',visible:true},{label:'New Arrivals',url:'#shop',visible:true},{label:'Sale',url:'#shop',visible:true}]},
     {id:'customer-care',title:'Customer Care',visible:true,links:[{label:'Contact Us',url:'#contact',visible:true},{label:'Order Tracking',url:'#tracking',visible:true},{label:'FAQ',url:'#faq',visible:true},{label:'Exchange & Returns',url:'#exchange',visible:true},{label:'Delivery Information',url:'#delivery',visible:true}]},
     {id:'company',title:'Company',visible:true,links:[{label:'About Us',url:'#about',visible:true},{label:'Privacy Policy',url:'#privacy',visible:true},{label:'Terms & Conditions',url:'#terms',visible:true},{label:'Shipping Policy',url:'#shipping',visible:true}]}
   ];
   d.footer.sections.forEach((sec,i)=>{sec.id=sec.id||('section'+i);sec.title=sec.title||'Links';if(!Array.isArray(sec.links))sec.links=[]});
   if(!Array.isArray(d.socials))d.socials=[{id:'fb',name:'Facebook',icon:'facebook',url:'https://facebook.com',visible:true},{id:'ig',name:'Instagram',icon:'instagram',url:'https://instagram.com',visible:true},{id:'tt',name:'TikTok',icon:'tiktok',url:'https://tiktok.com',visible:true},{id:'wa',name:'WhatsApp',icon:'whatsapp',url:'https://wa.me/94112345678',visible:true},{id:'yt',name:'YouTube',icon:'youtube',url:'https://youtube.com',visible:true}];
   if(!d.sitePages)d.sitePages={};
   const pageDefaults={
     about:{title:'About Us',body:'Tell your customers about your company.'},
     privacy:{title:'Privacy Policy',body:'Add your privacy policy here.'},
     terms:{title:'Terms & Conditions',body:'Add your terms and conditions here.'},
     shipping:{title:'Shipping Policy',body:'Add your shipping policy here.'},
     contact:{title:'Contact Us',body:'Add your contact information and support details here.'},
     tracking:{title:'Order Tracking',body:'Add your order tracking instructions here.'},
     faq:{title:'FAQ',body:'Add frequently asked questions and answers here.'},
     exchange:{title:'Exchange & Returns',body:'Add your exchange and returns policy here.'},
     delivery:{title:'Delivery Information',body:'Add delivery areas, timelines and charges here.'}
   };
   Object.entries(pageDefaults).forEach(([slug,pg])=>{if(!d.sitePages[slug])d.sitePages[slug]={...pg};});
   const footerPageLinks={contact:'#contact',tracking:'#tracking',faq:'#faq',exchange:'#exchange',delivery:'#delivery',about:'#about',privacy:'#privacy',terms:'#terms',shipping:'#shipping'};
   if(Array.isArray(d.footer?.sections)){
     d.footer.sections.forEach(sec=>(sec.links||[]).forEach(ln=>{
       const key=String(ln.label||'').toLowerCase().replace(/[^a-z]/g,'');
       const map={contactus:'contact',ordertracking:'tracking',faq:'faq',exchangereturns:'exchange',exchangepolicy:'exchange',deliveryinformation:'delivery',deliveryinfo:'delivery',aboutus:'about',privacypolicy:'privacy',termsconditions:'terms',shippingpolicy:'shipping'};
       if(map[key]) ln.url=footerPageLinks[map[key]];
     }));
   }
   if(!d.care)d.care={cards:[],faq:[]};d.care.title=d.care.title||'Customer Care';d.care.intro=d.care.intro||'We are here to help with orders, delivery, exchanges and product questions.';d.care.faqTitle=d.care.faqTitle||'Frequently Asked Questions';
   if(!Array.isArray(d.banners))d.banners=[];d.banners=d.banners.map((x,i)=>({...x,order:i+1,position:'carousel'}));
 }
 function write(){ensure();localStorage.setItem(KEY,JSON.stringify(d));render();window.dispatchEvent(new StorageEvent('storage',{key:KEY}));toast('Saved')}
 window.v9AdminSave=write;
 function addNav(){if(document.getElementById('v9-social-nav'))return;const nav=document.getElementById('nav');const b=document.createElement('button');b.id='v9-social-nav';b.textContent='Social & Footer';b.onclick=()=>v9Show('social');nav.appendChild(b);const p=document.createElement('button');p.id='v9-pages-nav';p.textContent='Pages & Customer Care';p.onclick=()=>v9Show('pages');nav.appendChild(p);const s=document.createElement('section');s.className='view';s.id='v-social';document.getElementById('views').appendChild(s);const ps=document.createElement('section');ps.className='view';ps.id='v-pages';document.getElementById('views').appendChild(ps)}
 window.v9Show=function(section){current=section;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+section).classList.add('active');document.getElementById('title').textContent=section==='social'?'Social & Footer':'Pages & Customer Care';if(section==='social')renderSocial();else renderPages()};
 function renderSocial(){ensure();const el=v('social');el.innerHTML=`<div class="card"><h3 style="margin-top:0">Footer & Social</h3><div class="v9-admin-note">Footer columns, links, payments and copyright are managed from Footer Manager. This area controls only social platforms.</div><div class="form"><label class="switch"><input id="v9fv" type="checkbox" ${d.footer.visible!==false?'checked':''}> Show Footer</label><div class="field"><label>Footer description</label><textarea id="v9fd">${esc9(d.footer.description||d.branding?.footer||'')}</textarea></div><div class="field"><label>Copyright</label><input id="v9fc" value="${esc9(d.footer.copyright||'© '+new Date().getFullYear()+' '+(d.branding?.name||'WOWSHOPPING.lk')+'. All rights reserved.')}"></div></div></div><div class="card"><div class="toolbar"><div><h3 style="margin:0">Follow Us</h3><div class="muted">Add links, change them anytime, or hide a platform without deleting it.</div></div><button class="btn primary" onclick="v9AddSocial()">+ Add Social</button></div>${d.socials.map((x,i)=>`<div class="v9-social-card"><div class="v9-social-icon">${esc9((x.name||'S').slice(0,1).toUpperCase())}</div><div class="form" style="gap:7px"><input id="v9sn${i}" value="${esc9(x.name)}" placeholder="Platform name"><input id="v9su${i}" value="${esc9(x.url)}" placeholder="https://..."><input id="v9si${i}" value="${esc9(x.icon||'link')}" placeholder="Lucide icon name"></div><label class="switch"><input id="v9sv${i}" type="checkbox" ${x.visible!==false?'checked':''}> Show</label></div>`).join('')}<button class="btn primary" onclick="v9SaveSocial()">Save Social Links</button></div>`}
 window.v9SaveSocial=function(){ensure();d.footer.visible=document.getElementById('v9fv').checked;d.footer.description=document.getElementById('v9fd').value;d.footer.copyright=document.getElementById('v9fc').value;d.socials=d.socials.map((x,i)=>({...x,name:document.getElementById('v9sn'+i).value.trim(),url:document.getElementById('v9su'+i).value.trim(),icon:document.getElementById('v9si'+i).value.trim()||'link',visible:document.getElementById('v9sv'+i).checked}));write()};
 window.v9AddSocial=function(){ensure();d.socials.push({id:id('social'),name:'New Platform',icon:'link',url:'https://',visible:true});write()};
 function renderPages(){
   ensure();
   const c=d.care;
   const pages=d.sitePages||{};
   const pageRows=Object.entries(pages).map(([slug,p])=>`<div class="v9-managed-page-row" style="border-top:1px solid #eee;padding:18px 0">
     <div class="two">
       <div class="field"><label>Page key / slug</label><input id="v9ps_${esc9(slug)}" value="${esc9(slug)}"></div>
       <div class="field"><label>Page title</label><input id="v9pt_${esc9(slug)}" value="${esc9(p.title)}"></div>
     </div>
     <div class="field"><label>Page content</label><textarea id="v9pb_${esc9(slug)}" rows="9">${esc9(p.body)}</textarea></div>
     <div class="muted" style="margin-bottom:8px">Footer URL: #${esc9(slug)}</div>
     <button class="btn danger" onclick="v9DeletePage('${esc9(slug)}')">Delete Page</button>
   </div>`).join('');
   el=v('pages');
   el.innerHTML=`<div class="card">
     <div class="toolbar"><div><h3 style="margin:0">Customer Care Page</h3><div class="muted">Edit the main customer-support content and FAQ heading.</div></div></div>
     <div class="v9-page-editor">
       <div class="field"><label>Page title</label><input id="v9ct" value="${esc9(c.title)}"></div>
       <div class="field"><label>Intro text</label><textarea id="v9ci">${esc9(c.intro)}</textarea></div>
       <div class="field"><label>FAQ heading</label><input id="v9cft" value="${esc9(c.faqTitle)}"></div>
       <button class="btn primary" onclick="v9SaveCarePage()">Save Customer Care Page</button>
     </div>
   </div>
   <div class="card">
     <div class="toolbar">
       <div><h3 style="margin:0">Footer Pages — Edit Everything</h3><div class="muted">Every Company and Customer Care footer page can be edited here. Changes appear on the storefront after saving.</div></div>
       <div style="display:flex;gap:8px;flex-wrap:wrap">
         <button class="btn" onclick="v9AddPage()">+ Add New Page</button>
         <button class="btn primary" onclick="v9SavePages()">Save All Pages</button>
       </div>
     </div>
     ${pageRows}
     <div style="margin-top:14px;padding:12px 14px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;font-size:12px;color:#475569">
       <b>Tip:</b> Footer links are connected to these page slugs. You can change the title and full text, or create additional pages and connect them from Footer Manager.
     </div>
   </div>`;
 }
 window.v9AddPage=function(){ensure();const slug='page-'+Date.now().toString().slice(-6);d.sitePages=d.sitePages||{};d.sitePages[slug]={title:'New Page',body:'Add your page content here.'};write()};
 window.v9DeletePage=function(slug){ensure();if(!confirm('Delete this page?'))return;delete d.sitePages[slug];write()};
 window.v9SaveCarePage=function(){ensure();d.care.title=document.getElementById('v9ct').value;d.care.intro=document.getElementById('v9ci').value;d.care.faqTitle=document.getElementById('v9cft').value;write()};
 window.v9SavePages=function(){
   ensure();
   const next={}; const slugMap={};
   Object.entries(d.sitePages||{}).forEach(([slug,p])=>{
     const ns=(document.getElementById('v9ps_'+slug)?.value||slug).trim().toLowerCase().replace(/[^a-z0-9-_]+/g,'-').replace(/^-+|-+$/g,'')||slug;
     slugMap[slug]=ns;
     next[ns]={
       title:document.getElementById('v9pt_'+slug)?.value?.trim()||p.title,
       body:document.getElementById('v9pb_'+slug)?.value??p.body
     };
   });
   d.sitePages=next;
   (d.footer?.sections||[]).forEach(sec=>(sec.links||[]).forEach(ln=>{
     const u=String(ln.url||'');
     if(u.startsWith('#')){
       const old=u.slice(1);
       if(slugMap[old]) ln.url='#'+slugMap[old];
     }
   }));
   write();
   showToast?.('All pages saved','success');
 };
 // Unlimited carousel banners + drag reorder.
 window.banners=function(){ensure();const bs=[...d.banners].sort((a,b)=>(a.order||0)-(b.order||0));v('banners').innerHTML=`<div class="toolbar"><div><b>Home Banner Carousel</b><div class="muted">Add as many banners as you want. All visible banners rotate inside one professional banner with Previous / Next controls.</div></div><button class="btn primary" onclick="editBanner()">+ Add Banner</button></div><div class="v9-admin-note">Tip: drag the cards to change the order. Use Hide when you want to keep a banner without showing it on the website.</div><div id="v9BannerAdminList">${bs.map((b,i)=>`<div class="card v9-drag" draggable="true" data-id="${esc9(b.id)}" style="margin-bottom:10px"><div class="row" style="padding:0;border:0"><div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="v9-handle"></span>${b.desktop?`<img class="thumb" src="${esc9(b.desktop)}">`:''}<div><b>Banner ${i+1}: ${esc9(b.title||'Untitled')}</b><div class="muted">${b.visible===false?'Hidden':'Visible'} · ${esc9(b.category||'Featured')}</div></div></div><div class="actions"><button class="btn" onclick="editBanner('${esc9(b.id)}')">Edit</button><button class="btn" onclick="toggle('banners','${esc9(b.id)}')">${b.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="del('banners','${esc9(b.id)}')">Delete</button></div></div></div>`).join('')}</div>`;let drag=null;document.querySelectorAll('#v9BannerAdminList [draggable]').forEach(x=>{x.addEventListener('dragstart',()=>drag=x);x.addEventListener('dragover',e=>e.preventDefault());x.addEventListener('drop',e=>{e.preventDefault();if(!drag||drag===x)return;const arr=[...document.querySelectorAll('#v9BannerAdminList [data-id]')].map(z=>z.dataset.id);const from=arr.indexOf(drag.dataset.id),to=arr.indexOf(x.dataset.id);if(from<0||to<0)return;const idv=arr.splice(from,1)[0];arr.splice(to,0,idv);d.banners.forEach(b=>b.order=arr.indexOf(b.id)+1);write()})})}
 // Better banner editor with mobile image and direct upload support.
 window.editBanner=function(bid){ensure();let b=bid?d.banners.find(x=>x.id===bid):{id:id('b'),title:'',desktop:'',mobile:'',description:'',button:'Shop Now',url:'#shop',category:'Featured',position:'carousel',visible:true,order:d.banners.length+1};open(`<h2>${bid?'Edit':'Add'} Banner</h2><div class="form"><div class="two"><div class="field"><label>Title</label><input id="bn" value="${esc9(b.title)}"></div><div class="field"><label>Category / Label</label><input id="bcat" value="${esc9(b.category||'Featured')}"></div></div><div class="field"><label>Desktop image URL</label><input id="bd" value="${esc9(b.desktop)}"></div><div class="field"><label>Mobile image URL (optional)</label><input id="bm" value="${esc9(b.mobile)}"></div><div class="field"><label>Upload desktop image</label><input type="file" accept="image/*" onchange="readSingleImage(this,'bd')"></div><div class="field"><label>Description</label><input id="bdesc" value="${esc9(b.description)}"></div><div class="two"><div class="field"><label>Button text</label><input id="bb" value="${esc9(b.button)}"></div><div class="field"><label>Button URL</label><input id="bu" value="${esc9(b.url)}"></div></div><label class="switch"><input id="bvis" type="checkbox" ${b.visible!==false?'checked':''}> Visible in carousel</label><div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="v9SaveBanner('${esc9(b.id)}')">Save Banner</button></div></div>`)};
 window.v9SaveBanner=function(bid){ensure();let old=d.banners.find(x=>x.id===bid);let b={id:bid,title:document.getElementById('bn').value,category:document.getElementById('bcat').value,desktop:document.getElementById('bd').value,mobile:document.getElementById('bm').value,description:document.getElementById('bdesc').value,button:document.getElementById('bb').value,url:document.getElementById('bu').value,position:'carousel',visible:document.getElementById('bvis').checked,order:old?.order||d.banners.length+1};let i=d.banners.findIndex(x=>x.id===bid);if(i<0)d.banners.push(b);else d.banners[i]=b;d.banners.forEach((x,i)=>x.order=i+1);write();closeModal()};
 const baseRender=window.render;window.render=function(){if(current==='social'){renderSocial();return}if(current==='pages'){renderPages();return}return baseRender()};
 const baseBoot=window.boot;window.addEventListener('load',()=>setTimeout(()=>{ensure();addNav();show(current||'dashboard');},50));
 // Make old banner label accurate.
 window.addEventListener('load',()=>setTimeout(()=>{const btn=document.querySelector('#nav button[data-s="banners"]');if(btn)btn.textContent='Banner Carousel';},80));
})();
</script>
</body></html>
